  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="63" height="63" rx="14.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
  <!-- E feito de três prateleiras: o do meio é o item em destaque -->
  <rect x="15" y="13" width="12" height="38" rx="2.5" fill="#F8FAFC"/>
  <rect x="15" y="13" width="34" height="9" rx="2.5" fill="#F8FAFC"/>
  <rect x="15" y="42" width="34" height="9" rx="2.5" fill="#F8FAFC"/>
  <rect x="15" y="27.5" width="26" height="9" rx="2.5" fill="url(#accent)"/>
